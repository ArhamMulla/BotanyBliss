spring:
  application:
    name: botanybliss

  profiles:
    active: s3

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}

storage:
  location: ./uploads/plant-images
  base-url: http://localhost:8080/api/plants/images/

aws:
  region: ap-southeast-2
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket-name: botanybliss-bucket