spring:
  application:
    name: botanybliss

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}

storage:
  location: ./uploads/plant-images
  base-url: http://localhost:8080/api/plants/images/